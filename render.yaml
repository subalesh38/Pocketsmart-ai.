databases:
  - name: pocketsmart-db
    databaseName: pocketsmart
    user: pocketsmart
    plan: free

services:
  - type: web
    name: pocketsmart-ai
    runtime: python
    plan: free
    buildCommand: ./render-build.sh
    preDeployCommand: cd backend && alembic upgrade head
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DATABASE_URL
        fromDatabase:
          name: pocketsmart-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "https://pocketsmart-ai.onrender.com"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: RATE_LIMIT_ENABLED
        value: "true"
